name: CI

# BUILD VERIFICATION POLICY (2026-07-03, closes #237):
# GitHub CI runs ONLY cheap Ubuntu checks (lint, spellcheck, path
# detection). The merge gate for builds and tests is LOCAL sandboxed
# verification on the dev machine — clean git worktree, isolated
# DerivedData, `swift test` + variant builds. See AGENTS.md
# "Build verification policy". Rationale: hosted macos-26 runners are
# billable at a premium and proved slow to useless here — the
# post-merge engine-app job never once finished inside its 120-minute
# timeout (#237), and the SDK job spent ~6 macOS-minutes per push
# duplicating what every PR already verified locally.
#
# The heavy macOS jobs are retained below behind `workflow_dispatch`
# for on-demand runs (e.g. before a public release tag).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_macos_builds:
        description: "Run the heavy macOS build+test jobs"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Path detection retained for the dispatch-gated macOS jobs and any
  # future cheap checks that want to skip docs-only PRs.
  changes:
    name: Detect Changed Paths
    # paths-filter has no natural base ref on manual dispatch; the macOS
    # jobs no longer consume these outputs, so skip it there entirely.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # dorny/paths-filter calls the GitHub API to list PR files; needs read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      engine: ${{ steps.filter.outputs.engine }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
            engine:
              - 'YoozEngine/**'
              - 'Tests/**'
              - 'project.yml'
              - 'Package.swift'
              - 'Package.resolved'
              - 'text-cleanup/**'
              - 'Vendor/**'
            ci:
              - '.github/workflows/**'

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check for typos
        uses: crate-ci/typos@v1

  swiftlint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.ci == 'true'
    # Runs in the official SwiftLint container on Ubuntu — lint does not
    # need a macOS runner. Same binary + same .swiftlint.yml as local.
    # Pinned so a new SwiftLint release cannot silently flip green PRs
    # red (or stop catching things) with no diff in this repo; bump the
    # pin deliberately.
    runs-on: ubuntu-latest
    container: ghcr.io/realm/swiftlint:0.65.0
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: swiftlint lint Sources/ YoozEngine/

  # ---------------------------------------------------------------
  # Heavy macOS jobs: workflow_dispatch ONLY. Not part of the merge
  # gate — local sandboxed verification is (AGENTS.md). Kept runnable
  # on demand for release-tag confidence or runner-behavior checks.
  # ---------------------------------------------------------------

  client-sdk:
    name: Client SDK Build + Test (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos_builds
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      # mlx-swift's Metal kernels need the Metal toolchain to build
      # via `xcodebuild`. `swift test` driving an MLX path otherwise
      # fails at runtime with `Failed to load the default metallib`.
      - name: Cache Metal Toolchain
        id: cache-metal-toolchain
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/MetalToolchains
          key: metal-toolchain-xcode-26.2-${{ runner.os }}

      - name: Download Metal Toolchain
        if: steps.cache-metal-toolchain.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache SwiftPM SourcePackages
        uses: actions/cache@v4
        with:
          path: .build/xcodebuild/SourcePackages
          key: spm-sdk-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-sdk-${{ runner.os }}-xcode-26.2-

      # Drive the SwiftPM-generated scheme through xcodebuild so the
      # bundled .metal sources compile into default.metallib.
      - name: Build + Test
        run: |
          xcodebuild test \
            -workspace . \
            -scheme YoozEngineRepo-Package \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -derivedDataPath .build/xcodebuild

  engine-app:
    name: Engine App Build + Test (manual)
    # Never completed inside its 120-minute timeout on hosted macos-26
    # (#237) — retained for workflow_dispatch only, in case runner
    # performance improves or a self-hosted runner lands (#23).
    if: github.event_name == 'workflow_dispatch' && inputs.run_macos_builds
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust + cross targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add x86_64-apple-darwin

      # The grammar engine ships as an XCFramework built from Rust source
      # under `text-cleanup/`; the binary is gitignored, so CI builds it.
      - name: Build YoozTextCleanup XCFramework
        run: |
          source "$HOME/.cargo/env"
          cd text-cleanup
          bash build-xcframework.sh
          cd ..
          mkdir -p Vendor/YoozTextCleanup
          rm -rf Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
          cp -R text-cleanup/build/YoozTextCleanup.xcframework Vendor/YoozTextCleanup/
          ls -la Vendor/YoozTextCleanup/

      - name: Cache Metal Toolchain
        id: cache-metal
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/MetalToolchains
          key: metal-toolchain-${{ runner.os }}-xcode-26.2

      - name: Download Metal Toolchain
        if: steps.cache-metal.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache SwiftPM SourcePackages
        uses: actions/cache@v4
        with:
          path: .build/xcodebuild/SourcePackages
          key: spm-engine-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-engine-${{ runner.os }}-xcode-26.2-

      # MLX_METAL_NO_NAX: hosted macos-26 runners advertise NAX kernels
      # the bundled metallib was not built with (#94); forcing it off
      # selects the standard kernels. YOOZ_ENGINE_HEADLESS keeps the
      # test-host app out of its menu-bar scene during XCTest hosting.
      - name: Build + Test engine app
        env:
          YOOZ_ENGINE_HEADLESS: "1"
        run: |
          xcodebuild test \
            -project YoozEngine.xcodeproj \
            -scheme YoozEngine \
            -configuration Debug \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcodebuild \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -DMLX_METAL_NO_NAX'
