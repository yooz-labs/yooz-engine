name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Compute which file groups changed so heavy macOS jobs can skip
  # docs-only PRs. Required status checks downstream are gated on this
  # job's outputs.
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # dorny/paths-filter calls the GitHub API to list PR files; needs read.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ steps.filter.outputs.swift }}
      engine: ${{ steps.filter.outputs.engine }}
      ci: ${{ steps.filter.outputs.ci }}
    steps:
      - uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            swift:
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
            engine:
              - 'YoozEngine/**'
              - 'Tests/**'
              - 'project.yml'
              - 'Package.swift'
              - 'Package.resolved'
              - 'text-cleanup/**'
              - 'Vendor/**'
            ci:
              - '.github/workflows/**'

  spellcheck:
    name: Spell Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Check for typos
        uses: crate-ci/typos@v1

  swiftlint:
    name: SwiftLint
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.engine == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-26
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint Sources/ YoozEngine/

  client-sdk:
    name: Client SDK Build + Test
    needs: changes
    if: needs.changes.outputs.swift == 'true' || needs.changes.outputs.ci == 'true'
    runs-on: macos-26
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      # mlx-swift's Metal kernels need the Metal toolchain to build
      # via `xcodebuild`. `swift test` driving an MLX path otherwise
      # fails at runtime with `Failed to load the default metallib`.
      # Phase-1 spike DECISION.md flagged this; we cache the
      # downloaded toolchain so subsequent runs skip the multi-minute
      # download.
      - name: Cache Metal Toolchain
        id: cache-metal-toolchain
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/MetalToolchains
          key: metal-toolchain-xcode-26.2-${{ runner.os }}

      - name: Download Metal Toolchain
        if: steps.cache-metal-toolchain.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      # Cache SwiftPM-resolved sources (mlx-swift + ~30 transitive
      # packages) so subsequent runs skip the multi-minute clone +
      # checkout phase. Keyed by Package.resolved so a dep bump
      # invalidates the cache cleanly.
      - name: Cache SwiftPM SourcePackages
        uses: actions/cache@v4
        with:
          path: .build/xcodebuild/SourcePackages
          key: spm-sdk-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-sdk-${{ runner.os }}-xcode-26.2-

      # `swift build` / `swift test` do not compile mlx-swift's Metal
      # kernel sources, so any test that exercises an MLX path crashes
      # at runtime with `Failed to load the default metallib`. We drive
      # the SwiftPM-generated `YoozEngineRepo-Package` scheme through
      # `xcodebuild` instead, which compiles the bundled `.metal`
      # sources into `default.metallib` using the toolchain downloaded
      # above. `-workspace .` selects the implicit SwiftPM workspace so
      # `xcodebuild` does not pick up `YoozEngine.xcodeproj` (which has
      # no SwiftPM scheme). `-skipMacroValidation` skips Xcode's macro
      # fingerprint prompt for swift-syntax macro plugins on CI;
      # `-skipPackagePluginValidation` does the same for any build plugins a
      # future MLX bump may carry (defensive; the 0.31.4 release ships none).
      #
      # `xcodebuild test` builds implicitly — the separate `build`
      # phase was duplicating ~15 minutes of compile work on every
      # run. Combined into one step for round-trip speed.
      - name: Build + Test
        run: |
          xcodebuild test \
            -workspace . \
            -scheme YoozEngineRepo-Package \
            -destination 'platform=macOS' \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -derivedDataPath .build/xcodebuild

  engine-app:
    name: Engine App Build + Test
    needs: changes
    # PR events skip this job entirely — GitHub-hosted macos-26
    # runners have proven too slow + GUI-handshake-prone for the
    # XCTest-hosted-by-Yooz-Engine.app pattern (the test host
    # tries to bring up its menu-bar scene during XCTest hosting
    # and stalls on a TCC signal that never arrives headlessly).
    # Local `xcodebuild test` is the PR-time verification gate;
    # consumer apps (whisper) re-verify on Xcode Cloud at promotion
    # to beta/testflight/stable. This job remains armed on direct
    # pushes to `main` as a post-merge sanity check — the runner
    # contention is more tolerable when nobody is blocked on it.
    if: github.event_name == 'push' && (needs.changes.outputs.engine == 'true' || needs.changes.outputs.ci == 'true')
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install Rust + cross targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
          source "$HOME/.cargo/env"
          rustup target add x86_64-apple-darwin

      # The grammar engine ships as an XCFramework built from Rust source
      # under `text-cleanup/`. The framework binary itself is gitignored
      # (`Vendor/YoozTextCleanup/YoozTextCleanup.xcframework`), so CI must
      # build it and stage it under `Vendor/YoozTextCleanup/` where the
      # engine target expects to link it.
      - name: Build YoozTextCleanup XCFramework
        run: |
          source "$HOME/.cargo/env"
          cd text-cleanup
          bash build-xcframework.sh
          cd ..
          mkdir -p Vendor/YoozTextCleanup
          rm -rf Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
          cp -R text-cleanup/build/YoozTextCleanup.xcframework Vendor/YoozTextCleanup/
          ls -la Vendor/YoozTextCleanup/

      # mlx-swift Metal kernels need the Xcode Metal toolchain. Cache it
      # because download is ~1 GB and slow on a cold runner. See
      # PR #50 / DECISION.md for the original spike.
      - name: Cache Metal Toolchain
        id: cache-metal
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/MetalToolchains
          key: metal-toolchain-${{ runner.os }}-xcode-26.2

      - name: Download Metal Toolchain
        if: steps.cache-metal.outputs.cache-hit != 'true'
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Generate Xcode project
        run: xcodegen generate

      # Cache SwiftPM-resolved sources (mlx-swift + ~30 transitive
      # packages) so subsequent runs skip the multi-minute clone +
      # checkout phase. Keyed by Package.resolved so a dep bump
      # invalidates the cache cleanly. Pinned `-derivedDataPath`
      # below so xcodebuild writes SourcePackages where this cache
      # expects to find them.
      - name: Cache SwiftPM SourcePackages
        uses: actions/cache@v4
        with:
          path: .build/xcodebuild/SourcePackages
          key: spm-engine-${{ runner.os }}-xcode-26.2-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            spm-engine-${{ runner.os }}-xcode-26.2-

      # mlx-swift's NAX (Neural Accelerator eXtension) Metal path lights
      # up at runtime when both:
      #   1. macOS 26.2+ is detected via `__builtin_available`
      #   2. the GPU's architecture generation is >= 17 (M3 / M3 Pro+)
      # GitHub-hosted `macos-26` runners satisfy both, so MLX requests
      # JIT-compiled `steel_gemm_fused_nax_*` kernels that the bundled
      # metallib was not built with — XCTest crashes immediately with
      # `Unable to load kernel steel_gemm_fused_nax_...` (see #94).
      #
      # Defining `MLX_METAL_NO_NAX` forces `is_nax_available()` (in
      # `Cmlx/mlx/mlx/backend/metal/device.h`) to return `false`, so MLX
      # picks the standard Metal kernels that ARE compiled into the
      # metallib. The xcodebuild-level `OTHER_CPLUSPLUSFLAGS` setting
      # propagates as a default into the SwiftPM-built Cmlx target's
      # C++ compile invocations.
      #
      # Local dev macs (currently macOS Sequoia / pre-26.2) hit
      # `__builtin_available` = false and never enter the NAX path, so
      # this flag is a no-op there.
      #
      # `MLXHuggingFaceMacros` (the `#huggingFaceTokenizerLoader` macro)
      # is an external Swift macro. CLI / non-interactive xcodebuild
      # needs `-skipMacroValidation` to bypass the per-machine trust
      # prompt.
      #
      # `xcodebuild test` builds implicitly — the prior split-step
      # form was duplicating compile work on every run. Combined
      # into a single phase + pinned `-derivedDataPath` so the
      # SourcePackages cache above sees a stable path.
      #
      # `YOOZ_ENGINE_HEADLESS=1` flips the Yooz Engine.app test host
      # into helper mode so it does not try to bring up the menu-bar
      # SwiftUI scene during XCTest hosting. Without this, the test
      # runner attached to the app sat waiting for a GUI signal that
      # never arrived on the headless macos-26 runner, causing the
      # job to stall the full xcodebuild test invocation past the
      # 60-min job timeout. See `EngineConfig.isHelper` for the
      # gating logic.
      - name: Build + Test engine app
        env:
          YOOZ_ENGINE_HEADLESS: "1"
        run: |
          xcodebuild test \
            -project YoozEngine.xcodeproj \
            -scheme YoozEngine \
            -configuration Debug \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            -destination 'platform=macOS' \
            -derivedDataPath .build/xcodebuild \
            OTHER_CPLUSPLUSFLAGS='$(inherited) -DMLX_METAL_NO_NAX'
