# QLoRA fine-tuning: Qwen3.5-0.8B (Light tier candidate)
# Base: mlx-community/Qwen3.5-0.8B-MLX-4bit (~625 MB)
# Use:  python scripts/train.py --config configs/qwen35-light.yaml
# Adapters land on S1 to keep the worktree clean.

model: "mlx-community/Qwen3.5-0.8B-MLX-4bit"
data: "./data/light"
adapter_path: "/Volumes/S1/yooz/research/issue-9/results/phase3_finetune/qwen35-light/adapters"

# Training: ~1 epoch over 24K samples (batch 4) — same budget as light-v3.yaml.
train: true
iters: 6000
batch_size: 4
learning_rate: 1.0e-5
seed: 42

# LoRA
num_layers: 8
lora_rank: 8

mask_prompt: true
max_seq_length: 512

val_batches: 25
steps_per_eval: 200
steps_per_report: 50
save_every: 500
