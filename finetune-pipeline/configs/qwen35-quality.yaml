# QLoRA fine-tuning: Qwen3.5-2B-OptiQ (Quality tier candidate)
# Base: mlx-community/Qwen3.5-2B-OptiQ-4bit (~1.4 GB)
# Use:  python scripts/train.py --config configs/qwen35-quality.yaml
# Adapters land on S1 to keep the worktree clean.

model: "mlx-community/Qwen3.5-2B-OptiQ-4bit"
data: "./data/quality"
adapter_path: "/Volumes/S1/yooz/research/issue-9/results/phase3_finetune/qwen35-quality/adapters"

# Training: ~0.7 epoch over 24K samples (batch 4) — same budget as quality-v3.yaml.
train: true
iters: 4200
batch_size: 4
learning_rate: 5.0e-6
seed: 42

# LoRA
num_layers: 16
lora_rank: 8

mask_prompt: true
max_seq_length: 1024

val_batches: 25
steps_per_eval: 200
steps_per_report: 50
save_every: 500
