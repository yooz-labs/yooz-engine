# QLoRA fine-tuning: Yooz-Light v1 -> v2
# Base: Qwen2.5-0.5B-Instruct-4bit (mlx-community)
# Output: yooz-light-v2 (fused model for app bundle)
# Usage: python scripts/train.py --config configs/light.yaml

model: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
data: "./data/light"
adapter_path: "./outputs/light/adapters"

# Training
train: true
iters: 600
batch_size: 4
learning_rate: 1.0e-5
seed: 42

# LoRA
num_layers: 8
lora_rank: 8

# Prompt masking (only compute loss on assistant tokens)
mask_prompt: true
max_seq_length: 512

# Evaluation
val_batches: 25
steps_per_eval: 50
steps_per_report: 10
save_every: 100
