# QLoRA fine-tuning: Yooz-Light v2 -> v3
# Base: Qwen2.5-0.5B-Instruct-4bit (mlx-community)
# Output: yooz-light-v3 (fused model for app bundle)
# Data: 14,967 gold-standard entries (5x v2) -> ~24K train samples
# Usage: python scripts/train.py --config configs/light-v3.yaml

model: "mlx-community/Qwen2.5-0.5B-Instruct-4bit"
data: "./data/light"
adapter_path: "./outputs/light-v3/adapters"

# Training: ~1 epoch over 24K samples (batch 4)
train: true
iters: 6000
batch_size: 4
learning_rate: 1.0e-5
seed: 42

# LoRA
num_layers: 8
lora_rank: 8

# Prompt masking (only compute loss on assistant tokens)
mask_prompt: true
max_seq_length: 512

# Evaluation
val_batches: 25
steps_per_eval: 200
steps_per_report: 50
save_every: 500
