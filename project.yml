name: YoozEngine
options:
  bundleIdPrefix: live.yooz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.6.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: "2.5.0"
  hummingbird-websocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    from: "0.21.2"
  mlx-swift-lm:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "2.30.3"

targets:
  EngineCore:
    type: framework
    platform: macOS
    sources:
      - Sources/EngineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.core
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"

  GrammarModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/Grammar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.grammar
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
    dependencies:
      - target: EngineCore
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  VADModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/VAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.vad
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
    dependencies:
      - target: EngineCore

  YoozEngine:
    type: application
    platform: macOS
    sources:
      - path: YoozEngine
        excludes:
          - Grammar/**
          - VAD/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine
        PRODUCT_NAME: Yooz Engine
        INFOPLIST_FILE: YoozEngine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngine.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        LSUIElement: true
    dependencies:
      - target: EngineCore
      - target: GrammarModule
      - target: VADModule
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  YoozEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YoozEngineTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: YoozEngine

  EngineCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/EngineCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore

  GrammarModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GrammarModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: GrammarModule
      - target: EngineCore

  VADModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/VADModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: VADModule
      - target: EngineCore
