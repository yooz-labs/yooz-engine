name: YoozEngine
options:
  bundleIdPrefix: live.yooz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: "2.5.0"
  hummingbird-websocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  # TurboQuant KV cache compression (issue #10) requires SharpAI's mlx-swift +
  # mlx-swift-lm forks. They add MLXFast.turboQuantEncode / turboDecodeK / V
  # plus the KVCacheSimple.turboQuantEnabled hook used by MLXLLMBackend.
  #
  # Both packages must track `main` together because mlx-swift-lm declares its
  # mlx-swift dep as `branch: "main"` — pinning a revision on the leaf package
  # collides with that branch constraint. The SharpAI bot keeps `main` rebased
  # on Apple upstream, so this is currently safe. Recommended last-known-good:
  #   mlx-swift:    e707b7f1610e77a32f12e3e28910d6bd3d9ffef1
  #   mlx-swift-lm: 38d7ff2840ab6b91a84b8f168c3cc2539f9356e1
  # When freezing for a release, snapshot Package.resolved into the repo.
  mlx-swift:
    url: https://github.com/SharpAI/mlx-swift
    branch: "main"
  mlx-swift-lm:
    url: https://github.com/SharpAI/mlx-swift-lm
    branch: "main"
  # mlx-swift-lm 3.x decoupled from HuggingFace — consuming apps now bring
  # their own concrete tokenizer + downloader. We use Apple's swift-transformers
  # (Tokenizers + Hub) and huggingface/swift-huggingface (HubClient namespace
  # used by the #huggingFaceTokenizerLoader macro). Pinned to the same versions
  # SharpAI's SwiftLM ships.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: "1.2.0"
    maxVersion: "1.3.0"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    from: "0.9.0"

targets:
  YoozEngine:
    type: application
    platform: macOS
    sources:
      - YoozEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine
        PRODUCT_NAME: Yooz Engine
        INFOPLIST_FILE: YoozEngine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngine.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        LSUIElement: true
    dependencies:
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      # mlx-swift-lm 3.x requires concrete Downloader + TokenizerLoader
      # implementations. MLXHuggingFace ships the macros; the runtime types
      # (Tokenizers.AutoTokenizer, HuggingFace.HubClient) come from
      # swift-transformers + swift-huggingface, which the macros expand into.
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: swift-huggingface
        product: HuggingFace
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  YoozEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YoozEngineTests
    dependencies:
      - target: YoozEngine

schemes:
  YoozEngine:
    build:
      targets:
        YoozEngine: all
        YoozEngineTests: [test]
    test:
      targets:
        - YoozEngineTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
