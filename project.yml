name: YoozEngine
options:
  bundleIdPrefix: live.yooz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

packages:
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    from: "2.5.0"
  hummingbird-websocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  # TurboQuant KV cache compression (issue #10) requires SharpAI's mlx-swift +
  # mlx-swift-lm forks. They add MLXFast.turboQuantEncode / turboDecodeK / V
  # plus the KVCacheSimple.turboQuantEnabled hook used by MLXLLMBackend.
  #
  # mlx-swift-lm is pinned to an explicit revision; mlx-swift is forced to
  # follow `branch: "main"` because mlx-swift-lm declares its mlx-swift dep
  # as a branch requirement, and SwiftPM cannot mix a branch requirement
  # from one consumer with a revision requirement from another. The
  # mlx-swift commit is therefore pinned via `Package.resolved` (committed
  # to the repo, un-gitignored) rather than here. Currently resolved:
  #   mlx-swift:    35191a6c3533765ee591130159c769ff5ddbd5f4 (via Package.resolved)
  #   mlx-swift-lm: 38d7ff2840ab6b91a84b8f168c3cc2539f9356e1 (revision below)
  #
  # See issue #10 / `results/PHASE1_FEASIBILITY.md` for the full rationale.
  #
  # Rebase policy: we re-verify these pins before each Yooz Engine release by
  # smoke-testing `KVCompressionTests` against newer SharpAI commits. If the
  # SharpAI bot stops rebasing (last push >30 days), we fall back to the
  # pinned commits below or vendor the forks under `yooz-labs/mlx-swift-yooz`.
  mlx-swift:
    url: https://github.com/SharpAI/mlx-swift
    branch: "main"
  mlx-swift-lm:
    url: https://github.com/SharpAI/mlx-swift-lm
    revision: "38d7ff2840ab6b91a84b8f168c3cc2539f9356e1"
  # mlx-swift-lm 3.x decoupled from HuggingFace — consuming apps now bring
  # their own concrete tokenizer + downloader. We use Apple's swift-transformers
  # (Tokenizers + Hub) and huggingface/swift-huggingface (HubClient namespace
  # used by the #huggingFaceTokenizerLoader macro). Pinned to the same versions
  # SharpAI's SwiftLM ships, with explicit upper caps so `swift package update`
  # can't pull in a 0.x minor with breaking renames.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: "1.2.0"
    maxVersion: "1.3.0"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    minVersion: "0.9.0"
    maxVersion: "0.10.0"

targets:
  YoozEngine:
    type: application
    platform: macOS
    sources:
      - YoozEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine
        PRODUCT_NAME: Yooz Engine
        # Force the Swift module name to `YoozEngine` (no underscore) so
        # `@testable import YoozEngine` resolves. By default Xcode derives
        # PRODUCT_MODULE_NAME from PRODUCT_NAME and replaces spaces with
        # underscores → `Yooz_Engine`, which the test target can't import
        # under the natural name.
        PRODUCT_MODULE_NAME: YoozEngine
        INFOPLIST_FILE: YoozEngine/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngine.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        LSUIElement: true
        # `MLXHuggingFaceMacros` (used by `#huggingFaceTokenizerLoader`) is an
        # external Swift macro. Xcode UI builds prompt for trust on first run;
        # CLI / CI must pass `-skipMacroValidation` on the xcodebuild command
        # line (it is an xcodebuild-level flag, not an OTHER_SWIFT_FLAGS one).
        # See AGENTS.md "Build" for the recommended invocation.
      configs:
        Debug:
          # Hardened runtime triggers macOS TCC prompts on /Volumes
          # access during xctest; the GUI prompt never resolves
          # under headless `xcodebuild test`, deadlocking parity
          # tests that read weights from /Volumes/S1. Keep hardened
          # runtime on for shipped builds (Release).
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXFast
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      # mlx-swift-lm 3.x requires concrete Downloader + TokenizerLoader
      # implementations. MLXHuggingFace ships the macros; the runtime types
      # (Tokenizers.AutoTokenizer, HuggingFace.HubClient) come from
      # swift-transformers + swift-huggingface, which the macros expand into.
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: swift-huggingface
        product: HuggingFace
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  YoozEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YoozEngineTests
    settings:
      base:
        # The app target sets PRODUCT_NAME to "Yooz Engine" (with a space)
        # so the host bundle path needs the same. XcodeGen otherwise picks
        # `YoozEngine.app` from the target name and the resolver fails with
        # "Could not find test host."
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yooz Engine.app/Contents/MacOS/Yooz Engine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        # XcodeGen does not auto-generate an Info.plist for test bundles
        # under the modern toolchain; let Xcode synthesize one so we don't
        # have to maintain a separate Info.plist for tests.
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.tests
    dependencies:
      - target: YoozEngine

schemes:
  YoozEngine:
    build:
      targets:
        YoozEngine: all
        YoozEngineTests: [test]
    test:
      config: Debug
      targets:
        - YoozEngineTests
      gatherCoverageData: false
    run:
      config: Debug
    archive:
      config: Release
