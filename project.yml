name: YoozEngine
options:
  bundleIdPrefix: live.yooz
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "0.7.5"
    CURRENT_PROJECT_VERSION: "1"

packages:
  hummingbird:
    url: https://github.com/hummingbird-project/hummingbird
    # Pinned for Xcode integration runs. Newer 2.22.x pulls a
    # swift-http-types trait combo that Xcode 17.4 rejects before build.
    exactVersion: "2.20.1"
  hummingbird-websocket:
    url: https://github.com/hummingbird-project/hummingbird-websocket
    from: "2.2.0"
  # Xcode's package resolver floats this transitive dependency to 1.4.x,
  # where Hummingbird 2.20.1 fails under explicit module builds with missing
  # DequeModule imports. Keep the Xcode graph on the known-good 1.3.x line.
  swift-collections:
    url: https://github.com/apple/swift-collections.git
    exactVersion: "1.3.0"
  # MLX runtime — Apple's ml-explore upstream. We track the mlx community now
  # (yooz-labs/mlx-swift-lm is a clean fork of ml-explore, not SharpAI). The
  # SharpAI lineage is retired; its only unique carry was TurboQuant (issue #10),
  # now parked — see results/PHASE1_FEASIBILITY.md.
  #
  #   - mlx-swift: the 0.31.4 release (what mlx-swift-lm main declares,
  #     `.upToNextMinor(from: 0.31.4)`). We pin the release, not mlx-swift main —
  #     main is on swift-tools 6.3 (an unreleased toolchain CI lacks), while
  #     0.31.4 needs only the stable toolchain. The Gemma4 APIs we depend on
  #     (ropeOffset / weightedExpertSum) live in mlx-swift-lm, not mlx-swift.
  #   - mlx-swift-lm @ 0f1865a: yooz-labs/mlx-swift-lm `main` = ml-explore main
  #     (swift-tools 6.1; E-series KV-sharing is upstream via #342) plus two
  #     deltas, each with an upstream PR in flight: (1) drop the gemma4_unified
  #     `vision_embedder` weights in sanitize so the multimodal 12B checkpoint
  #     loads (ml-explore PR #363); (2) bring the MLXVLM Gemma4 MoE block to the
  #     MLXLLM text path so 26B-A4B loads through the Infinite backend
  #     (ml-explore PR #364). Pinned to a revision (not the 3.31.3 release)
  #     because that release predates this Gemma4 work. Re-pin to a clean
  #     ml-explore tag once both land upstream + ship.
  mlx-swift:
    url: https://github.com/ml-explore/mlx-swift
    exactVersion: "0.31.4"
  mlx-swift-lm:
    url: https://github.com/yooz-labs/mlx-swift-lm
    revision: "0f1865ad8d44824c5ad36ba1e9e4203d74838eb6"
  # mlx-swift-lm 3.x decoupled from HuggingFace — consuming apps now bring
  # their own concrete tokenizer + downloader. We use Apple's swift-transformers
  # (Tokenizers + Hub) and huggingface/swift-huggingface (HubClient namespace
  # used by the #huggingFaceTokenizerLoader macro). Pinned to the versions our
  # mlx-swift-lm fork ships, with explicit upper caps so `swift package update`
  # can't pull in a 0.x minor with breaking renames.
  swift-transformers:
    url: https://github.com/huggingface/swift-transformers
    minVersion: "1.2.0"
    maxVersion: "1.3.0"
  swift-huggingface:
    url: https://github.com/huggingface/swift-huggingface
    minVersion: "0.9.0"
    maxVersion: "0.10.0"
  # Local Swift package at repo root. Used by IntegrationTests (A8 / #32)
  # so the end-to-end harness talks to the engine through the same SDK
  # that thin clients use in production. No version pin — xcodegen tracks
  # `Package.swift` directly.
  YoozEngineClient:
    path: .

targets:
  EngineCore:
    type: framework
    platform: macOS
    sources:
      - Sources/EngineCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.core
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"

  GrammarModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/Grammar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.grammar
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  VADModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/VAD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.vad
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore

  LLMModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/LLM
      - YoozEngine/TouchUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.llm
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      # mlx-swift-lm 3.x decoupled tokenizer + downloader from mlx-swift-lm
      # itself. The `#huggingFaceTokenizerLoader` and HF downloader macros
      # expand into types from swift-transformers + swift-huggingface, so
      # both packages must be linked into LLMModule directly.
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: swift-huggingface
        product: HuggingFace

  InfiniteModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/Infinite
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.infinite
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore
      # MLX inference for the native-context backend (Phase 7). Mirrors
      # LLMModule: the HF tokenizer/downloader macros expand into
      # swift-transformers + swift-huggingface types, so both are linked.
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift-lm
        product: MLXLLM
      - package: mlx-swift-lm
        product: MLXLMCommon
      - package: mlx-swift-lm
        product: MLXHuggingFace
      - package: swift-transformers
        product: Tokenizers
      - package: swift-transformers
        product: Hub
      - package: swift-huggingface
        product: HuggingFace

  STTModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/STT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.stt
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore
      - package: mlx-swift
        product: MLX
      - package: mlx-swift
        product: MLXNN
      - package: mlx-swift
        product: MLXRandom
      - package: mlx-swift
        product: MLXFast
      # mlx-swift-lm common runtime types — used by the qwen3 pipeline
      # (LMCommon `Tokens`, `KVCacheSimple`, etc.). Kept off LLMModule's
      # dep list because LLMModule consumes them through MLXLLM.
      - package: mlx-swift-lm
        product: MLXLMCommon
      # Tokenizers — qwen3 pipeline uses Apple's swift-transformers
      # for the BPE tokenizer.
      - package: swift-transformers
        product: Tokenizers
      # Hub — Qwen3ASRPipeline calls Tokenizers.AutoTokenizer.from, whose
      # default arg references Hub.HubApi, so the dylib must link Hub directly.
      - package: swift-transformers
        product: Hub
      # HF auto-download support for STT models (#95).
      - package: swift-huggingface
        product: HuggingFace

  # Apple STT backend — wraps SFSpeechRecognizer (macOS 14-25) and
  # SpeechAnalyzer (macOS 26+, gated by #available). No MLX footprint; used by
  # YoozEngineLite to ship a sub-GB engine bundle, and listed alongside
  # STTModule in full/whisper variants so the engine-picker can offer all
  # three backends (parakeet, fast_conformer, apple_stt).
  AppleSTTModule:
    type: framework
    platform: macOS
    sources:
      - YoozEngine/AppleSTT
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.apple-stt
        DEFINES_MODULE: "YES"
        SKIP_INSTALL: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore

  YoozEngine:
    type: application
    platform: macOS
    sources:
      - path: YoozEngine
        excludes:
          - AppleSTT/**
          - Grammar/**
          - Infinite/**
          - LLM/**
          - STT/**
          - TouchUp/**
          - VAD/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine
        PRODUCT_NAME: Yooz Engine
        # Force the Swift module name to `YoozEngine` (no underscore) so
        # `@testable import YoozEngine` resolves. By default Xcode derives
        # PRODUCT_MODULE_NAME from PRODUCT_NAME and replaces spaces with
        # underscores → `Yooz_Engine`, which the test target can't import
        # under the natural name.
        PRODUCT_MODULE_NAME: YoozEngine
        INFOPLIST_FILE: YoozEngine/Info.plist
        # Runtime variant dispatch — substituted into Info.plist's
        # `YoozBuildVariant` key via the `$(YOOZ_BUILD_VARIANT)` template.
        # Swift compile conditions can't be used because EngineCore.framework
        # is built once and shared across all three app variants.
        YOOZ_BUILD_VARIANT: full
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngine.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        LSUIElement: true
        # `MLXHuggingFaceMacros` (used by `#huggingFaceTokenizerLoader`) is an
        # external Swift macro. Xcode UI builds prompt for trust on first run;
        # CLI / CI must pass `-skipMacroValidation` on the xcodebuild command
        # line (it is an xcodebuild-level flag, not an OTHER_SWIFT_FLAGS one).
        # See AGENTS.md "Build" for the recommended invocation.
      configs:
        Debug:
          # Hardened runtime triggers macOS TCC prompts on /Volumes
          # access during xctest; the GUI prompt never resolves
          # under headless `xcodebuild test`, deadlocking parity
          # tests that read weights from /Volumes/S1. Keep hardened
          # runtime on for shipped builds (Release).
          ENABLE_HARDENED_RUNTIME: false
        Release:
          ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - target: EngineCore
      - target: AppleSTTModule
      - target: GrammarModule
      - target: InfiniteModule
      - target: LLMModule
      - target: STTModule
      - target: VADModule
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      # APIServer.mapSTTLoadError demuxes HubCacheError directly so the
      # HuggingFace package must be linked into the app target, not just
      # the per-module targets that produce the errors.
      - package: swift-huggingface
        product: HuggingFace
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  # Slim build variant: bundled into yooz-whisper.app as an embedded helper.
  # Identical sources to the full YoozEngine target, but deliberately omits
  # VADModule — whisper keeps VAD embedded locally in the client (A1 design §4).
  # VAD-dependent code in APIServer/EngineAppDelegate is gated by
  # `#if canImport(VADModule)` so it compiles out cleanly here. The remaining
  # differentiation today is the VARIANT_WHISPER compile condition and bundle
  # identity; downstream slim variants (Notes, Voice) will drop more modules.
  #
  # A5 (#29): CODE_SIGN_ENTITLEMENTS points at the whisper-specific file so
  # future permission tightening (e.g. dropping network.server once the host
  # app proxies) doesn't churn the full engine's entitlements. The file is
  # a verbatim copy of YoozEngine.entitlements today.
  YoozEngineWhisper:
    type: application
    platform: macOS
    sources:
      - path: YoozEngine
        excludes:
          - AppleSTT/**
          - Grammar/**
          - Infinite/**
          - LLM/**
          - STT/**
          - TouchUp/**
          - VAD/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.whisper
        PRODUCT_NAME: Yooz Engine (Whisper)
        INFOPLIST_FILE: YoozEngine/Info.plist
        # Runtime variant dispatch — see the equivalent comment on the full
        # variant target.
        YOOZ_BUILD_VARIANT: whisper
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngineWhisper.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        LSUIElement: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "VARIANT_WHISPER"
    dependencies:
      - target: EngineCore
      - target: AppleSTTModule
      - target: GrammarModule
      - target: LLMModule
      - target: STTModule
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      - package: swift-huggingface
        product: HuggingFace
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  # Sub-GB build variant for Remi-class apps, iOS ports (future epic), and
  # any Mac app that wants an engine without the MLX runtime. Deliberately
  # omits STTModule (MLX Parakeet + FastConformer) and VADModule. Apple STT
  # is the sole speech backend. Sources mirror the full variant; the
  # `VARIANT_LITE` compile condition toggles `BuildVariant.current`, and all
  # MLX-dependent code paths are already gated by `#if canImport(STTModule)`
  # / `#if canImport(VADModule)` in APIServer + EngineAppDelegate.
  YoozEngineLite:
    type: application
    platform: macOS
    sources:
      - path: YoozEngine
        excludes:
          - AppleSTT/**
          - Grammar/**
          - Infinite/**
          - LLM/**
          - STT/**
          - TouchUp/**
          - VAD/**
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.lite
        PRODUCT_NAME: Yooz Engine (Lite)
        INFOPLIST_FILE: YoozEngine/Info.plist
        # Runtime variant dispatch — see the equivalent comment on the full
        # variant target.
        YOOZ_BUILD_VARIANT: lite
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: YoozEngine/YoozEngine.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        LSUIElement: true
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "VARIANT_LITE"
    dependencies:
      - target: EngineCore
      - target: AppleSTTModule
      - target: GrammarModule
      - target: LLMModule
      - package: hummingbird
        product: Hummingbird
      - package: hummingbird-websocket
        product: HummingbirdWebSocket
      - framework: Vendor/YoozTextCleanup/YoozTextCleanup.xcframework
        embed: false

  YoozEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/YoozEngineTests
    settings:
      base:
        # The app target sets PRODUCT_NAME to "Yooz Engine" (with a space)
        # so the host bundle path needs the same. XcodeGen otherwise picks
        # `YoozEngine.app` from the target name and the resolver fails with
        # "Could not find test host."
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Yooz Engine.app/Contents/MacOS/Yooz Engine"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: live.yooz.engine.tests
    dependencies:
      - target: YoozEngine
      # Explicit module deps let tests `import` modules directly instead of
      # relying on transitive framework search paths from the app target.
      # ModulesEndpointTests uses real singletons (GrammarEngine, VADEngine)
      # without mocks, per yooz-engine policy. STTModule + LLMModule +
      # AppleSTTModule are required for Phase5/Phase6/Qwen3ASR tests that
      # reference STT-side types (STTBackendID, STTBackendMetrics,
      # Qwen3ASRPipeline, PreviewModelFetcherAdapter, etc.) which live
      # outside the YoozEngine app target's source list.
      - target: EngineCore
      - target: GrammarModule
      - target: InfiniteModule
      - target: VADModule
      - target: STTModule
      - target: LLMModule
      - target: AppleSTTModule
      # Tests link Tokenizers + HuggingFace directly because the
      # Qwen3ASR/Phase5 suites reach into Tokenizer + Hub APIs that the
      # framework targets re-export only transitively.
      - package: swift-transformers
        product: Tokenizers
      # Hub — Qwen3ASR test suites call Tokenizers.AutoTokenizer.from, whose
      # default arg references Hub.HubApi, so the test bundle must link Hub.
      - package: swift-transformers
        product: Hub
      - package: swift-huggingface
        product: HuggingFace
      # Qwen3ASR decoder structural tests reference MLXLMCommon.LanguageModel /
      # KVCache directly, so the test bundle must link MLX + MLXLMCommon (a
      # clean build won't satisfy these via transitive framework re-export).
      - package: mlx-swift
        product: MLX
      - package: mlx-swift-lm
        product: MLXLMCommon

  EngineCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/EngineCoreTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: EngineCore

  GrammarModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/GrammarModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: GrammarModule
      - target: EngineCore

  LLMModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/LLMModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: LLMModule
      - target: EngineCore

  InfiniteModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/InfiniteModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: InfiniteModule
      - target: EngineCore

  STTModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/STTModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: STTModule
      - target: EngineCore

  AppleSTTModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/AppleSTTModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: AppleSTTModule
      - target: EngineCore

  VADModuleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/VADModuleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - target: VADModule
      - target: EngineCore

  # A8 / #32 — end-to-end integration harness.
  # Drives a freshly-built Yooz Engine.app subprocess through the
  # YoozEngineClient SPM package (added under `packages:` above).
  # Gated at runtime by YOOZ_INTEGRATION=1; default CI runs only the
  # harness-helper unit tests. See scripts/run-integration.sh for the
  # full run entry point and Tests/IntegrationTests/CLAUDE notes in
  # EndToEndTests.swift for scope.
  IntegrationTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/IntegrationTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
    dependencies:
      - package: YoozEngineClient
        product: YoozEngineClient

# Explicit schemes so XcodeGen emits `.xcscheme` files with test plans wired
# in. Without this block xcodegen auto-generates schemes per target but drops
# no `TestPlans` reference, and `xcodebuild -testPlan` fails with
# "The test plan ... was not found". Plans live in `TestPlans/` at repo root
# so they are not wiped by `xcodegen generate` (which recreates the .xcodeproj
# directory, including xcshareddata/xcschemes).
schemes:
  YoozEngine:
    build:
      targets:
        YoozEngine: all
        YoozEngineTests: [test]
        InfiniteModuleTests: [test]
        LLMModuleTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - YoozEngineTests
        # EngineCore is a framework target shared across the three app
        # variants; its unit tests (BuildVariant, ModuleHealth, and the
        # EngineConfig helper-mode contract for #42) belong in the
        # default scheme so a regression in helper suppression surfaces
        # in the standard CI sweep rather than at integration time.
        - EngineCoreTests
        # LLMModuleTests covers `parseProofreadResponse` /
        # `parseValidateResponse` defensive parsing (#113 placeholder echo
        # guard, #134 markdown fence + multi-object recovery). These are
        # pure string-in / tuple-out tests with no model dependency, so
        # they belong in the standard CI sweep rather than the integration
        # plan.
        - InfiniteModuleTests
        - LLMModuleTests
    run:
      config: Debug
    archive:
      config: Release
  IntegrationTests:
    build:
      targets:
        YoozEngine: [run, test]
        IntegrationTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      testPlans:
        - path: TestPlans/IntegrationTests.xctestplan
          defaultPlan: true
      targets:
        - IntegrationTests

  # Live gemma4 parity (#184). Separate scheme + test plan so the gate var
  # INFINITE_LIVE=1 reaches the xctest process (xcodebuild does not propagate
  # CLI env to the hosted test runner — see scripts/run-integration.sh). The
  # default YoozEngine scheme never loads this plan, so CI skips the heavy
  # model-loading test. Run locally with cached weights:
  #   xcodebuild -project YoozEngine.xcodeproj -scheme InfiniteLive \
  #     -skipMacroValidation -derivedDataPath build \
  #     -destination 'platform=macOS' test
  InfiniteLive:
    build:
      targets:
        YoozEngine: all
        YoozEngineTests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      testPlans:
        - path: TestPlans/InfiniteLive.xctestplan
          defaultPlan: true
      targets:
        - YoozEngineTests
