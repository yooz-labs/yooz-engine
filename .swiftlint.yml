excluded:
  - Vendor
  - .build
  - YoozEngine/Grammar/yooz_text_cleanup.swift
  - YoozEngine/Grammar/NLTaggerBridge.swift

line_length:
  warning: 150
  error: 200

opt_in_rules:
  - empty_count

disabled_rules:
  - todo
  - trailing_comma
  - identifier_name
  - shorthand_operator
  - nesting
  - cyclomatic_complexity
  - function_body_length
  - type_body_length
  - file_length
  - force_unwrapping
